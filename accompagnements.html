<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculateur calories - Mifflin-St Jeor</title>
    <style>
      :root {
        --bg: #060b07;
        --bg-soft: #0d1711;
        --panel: rgba(11, 22, 16, 0.9);
        --card: rgba(18, 33, 24, 0.75);
        --line: rgba(94, 255, 157, 0.35);
        --green: #6afcb2;
        --green-strong: #27d67d;
        --green-soft: #b6ffd8;
        --text: #edfef6;
        --muted: #a5cbb5;
        --shadow: rgba(26, 253, 143, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(39, 214, 125, 0.18), transparent 30%),
          linear-gradient(135deg, #030805, #08130d 40%, #020503 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .app {
        width: min(100%, 980px);
        background: rgba(9, 18, 13, 0.8);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 18px 60px var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .header {
        background: linear-gradient(90deg, rgba(18, 33, 24, 0.9), rgba(9, 17, 12, 0.9));
        border-bottom: 1px solid var(--line);
        padding: 28px 32px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border: 1px solid rgba(106, 252, 178, 0.4);
        background: rgba(38, 214, 125, 0.08);
        border-radius: 999px;
        color: var(--green-soft);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.1;
      }

      .subtitle {
        color: var(--muted);
        margin: 0;
        font-size: 1rem;
      }

      .content {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 24px;
        padding: 28px 32px 32px;
      }

      .panel {
        background: linear-gradient(180deg, rgba(18, 32, 24, 0.95), rgba(11, 19, 14, 0.95));
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 24px;
      }

      .panel h2 {
        margin-top: 0;
        font-size: 1.1rem;
        color: var(--green-soft);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .field label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .field input,
      .field select {
        width: 100%;
        background: rgba(4, 11, 8, 0.9);
        border: 1px solid rgba(106, 252, 178, 0.3);
        border-radius: 12px;
        color: var(--text);
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      .field input:focus,
      .field select:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 4px rgba(106, 252, 178, 0.1);
        transform: translateY(-1px);
      }

      .radio-group {
        display: flex;
        gap: 12px;
        margin-top: 8px;
      }

      .radio-option {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(106, 252, 178, 0.25);
        background: rgba(10, 19, 14, 0.7);
        color: var(--text);
        cursor: pointer;
      }

      .radio-option input {
        accent-color: var(--green-strong);
        width: 18px;
        height: 18px;
      }

      .result-box {
        margin-top: 20px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(26, 216, 126, 0.12), rgba(11, 19, 14, 0.8));
        border: 1px solid rgba(106, 252, 178, 0.28);
        padding: 18px;
      }

      .result-label {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .result-value {
        display: flex;
        align-items: end;
        gap: 8px;
        margin-top: 10px;
      }

      .big-number {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 800;
        color: var(--green-soft);
        line-height: 1;
      }

      .unit {
        color: var(--muted);
        font-size: 0.95rem;
        padding-bottom: 10px;
      }

      .formula {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid rgba(106, 252, 178, 0.2);
        color: var(--muted);
        line-height: 1.7;
        font-size: 0.95rem;
      }

      .formula strong {
        color: var(--green-soft);
      }

      @media (max-width: 760px) {
        .content {
          grid-template-columns: 1fr;
        }

        .fields {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useMemo, useState } = React;

      function App() {
        const [gender, setGender] = useState('male');
        const [age, setAge] = useState(30);
        const [height, setHeight] = useState(175);
        const [weight, setWeight] = useState(70);

        const bmr = useMemo(() => {
          const w = Number(weight) || 0;
          const h = Number(height) || 0;
          const a = Number(age) || 0;

          if (gender === 'male') {
            return 10 * w + 6.25 * h - 5 * a + 5;
          }

          return 10 * w + 6.25 * h - 5 * a - 161;
        }, [age, gender, height, weight]);

        return (
          <div className="app">
            <header className="header">
              <div className="badge">• Mifflin-St Jeor</div>
              <h1>Compteur calorique</h1>
              <p className="subtitle">Estimez votre métabolisme de base avec précision.</p>
            </header>

            <main className="content">
              <section className="panel">
                <h2>Vos données</h2>

                <div className="fields">
                  <div className="field" style={{ gridColumn: '1 / -1' }}>
                    <label>Sexe</label>
                    <div className="radio-group">
                      <label className="radio-option">
                        <input
                          type="radio"
                          name="gender"
                          value="male"
                          checked={gender === 'male'}
                          onChange={(e) => setGender(e.target.value)}
                        />
                        Homme
                      </label>
                      <label className="radio-option">
                        <input
                          type="radio"
                          name="gender"
                          value="female"
                          checked={gender === 'female'}
                          onChange={(e) => setGender(e.target.value)}
                        />
                        Femme
                      </label>
                    </div>
                  </div>

                  <div className="field">
                    <label htmlFor="age">Âge</label>
                    <input
                      id="age"
                      type="number"
                      min="10"
                      max="120"
                      value={age}
                      onChange={(e) => setAge(e.target.value)}
                    />
                  </div>

                  <div className="field">
                    <label htmlFor="height">Taille (cm)</label>
                    <input
                      id="height"
                      type="number"
                      min="100"
                      max="250"
                      value={height}
                      onChange={(e) => setHeight(e.target.value)}
                    />
                  </div>

                  <div className="field" style={{ gridColumn: '1 / -1' }}>
                    <label htmlFor="weight">Poids (kg)</label>
                    <input
                      id="weight"
                      type="number"
                      min="20"
                      max="300"
                      step="0.1"
                      value={weight}
                      onChange={(e) => setWeight(e.target.value)}
                    />
                  </div>
                </div>
              </section>

              <aside className="panel">
                <h2>Résultat</h2>

                <div className="result-box">
                  <div className="result-label">Méta. de base</div>
                  <div className="result-value">
                    <span className="big-number">{Math.round(bmr)}</span>
                    <span className="unit">kcal/jour</span>
                  </div>
                </div>

                <div className="formula">
                  <strong>Formule Mifflin-St Jeor :</strong><br />
                  Homme : 10 × poids + 6,25 × taille − 5 × âge + 5<br />
                  Femme : 10 × poids + 6,25 × taille − 5 × âge − 161
                </div>
              </aside>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
